[package]
name = "solar-system-navigator"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "3D orbital simulation and trajectory planning for the solar system"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "solar-system-navigator"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = []
web = ["bevy/web", "bevy/webgpu"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["3d", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
approx = "0.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
