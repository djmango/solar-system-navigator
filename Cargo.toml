[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-wasm", "crates/navigator-legacy"]
default-members = ["crates/sim-core", "crates/sim-wasm"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
approx = "0.5"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
