[package]
name = "solar-system-navigator"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "3D orbital simulation and trajectory planning for the solar system"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.18", features = ["3d", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
approx = "0.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
