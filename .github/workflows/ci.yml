name: CI

on:
  push:
    branches: [master, 'sully/**']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Smaller textures for CI; build.rs auto-fetches when assets/textures/ is empty.
  SOLAR_TEXTURE_RES: 2k

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt, clippy
      - name: Verify rust-toolchain.toml
        run: grep -q '1.95' rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release -p sim-core -p sim-wasm

  web:
    name: Build (web / WASM)
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    env:
      SOLAR_TEXTURE_RES: 2k
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build web app
        run: bash scripts/cloudflare-pages-build.sh
